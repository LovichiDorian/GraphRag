# Multi-arch images built natively (amd64 + arm64 runners, no QEMU), pushed by
# digest, merged into a manifest list, signed with cosign (keyless / OIDC),
# scanned with Trivy, then deployed by committing the new tag (GitOps).
name: Release

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - data/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/lovichidorian/graphrag

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: api
            context: .
            file: apps/api/Dockerfile
          - image: web
            context: apps/web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }} (manifest · cosign · trivy)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
      security-events: write # Trivy SARIF upload
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Create the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # tag flags and digests must word-split
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_PREFIX }}-${{ matrix.image }}@sha256:%s ' *)
      - id: digest
        name: Resolve the manifest digest
        run: |
          ref="${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          echo "digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - name: Check that the cluster can pull the image anonymously
        run: |
          repo="${IMAGE_PREFIX#ghcr.io/}-${{ matrix.image }}"
          token=$(curl -sf "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/${repo}/manifests/latest")
          if [[ "$code" == "200" ]]; then
            echo "ghcr.io/${repo} is public"
          else
            msg="ghcr.io/${repo} is private (HTTP ${code}): make it public in the package settings so k3s can pull it — https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/package/${repo#*/}"
            echo "::warning::${msg}"
            echo "- ${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign with cosign (keyless, GitHub OIDC)
        run: cosign sign --yes "${{ env.IMAGE_PREFIX }}-${{ matrix.image }}@${{ steps.digest.outputs.digest }}"
      # Scanning informs, it never blocks a deployment (e.g. when the Trivy DB is rate limited).
      - name: Trivy vulnerability scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}@${{ steps.digest.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        if: steps.trivy.outcome == 'success'
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  deploy:
    name: Deploy (GitOps tag bump → Argo CD)
    needs: publish
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Bump image tags in the prod overlay
        run: |
          tag="sha-${GITHUB_SHA::7}"
          sed -i -E "s/(newTag: ).*/\1${tag}/" deploy/k8s/overlays/prod/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && { echo "Nothing to deploy"; exit 0; }
          git commit -m "chore(deploy): release ${tag} [skip ci]"
          for attempt in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((attempt * 5)); done
          echo "### Deployed \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
