# Non-secret runtime configuration (12-factor). Secrets live in `graphrag-secrets`,
# created by deploy/scripts/install.sh — never committed to git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphrag-config
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  LOG_JSON: "true"
  NEO4J_URI: bolt://graphrag-neo4j:7687
  NEO4J_USER: neo4j
  PUBLIC_URL: https://graphrag.dorianlovichi.com
  CORS_ORIGINS: https://graphrag.dorianlovichi.com
  GITHUB_USER: LovichiDorian
  RATE_LIMIT_PER_MINUTE: "8"
  RATE_LIMIT_PER_DAY: "80"
  LLM_DAILY_BUDGET: "3000"
  WARM_CACHE: "true"
