# Traefik (bundled with k3s) edge policies.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    permissionsPolicy: camera=(), microphone=(), geolocation=()
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
spec:
  compress:
    excludedContentTypes:
      - text/event-stream
---
# Coarse edge rate limit for the API; the app adds per-client and daily LLM budgets.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-ratelimit
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 30
