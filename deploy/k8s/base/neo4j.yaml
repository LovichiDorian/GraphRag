apiVersion: v1
kind: Service
metadata:
  name: graphrag-neo4j
  labels:
    app.kubernetes.io/name: graphrag-neo4j
    app.kubernetes.io/component: neo4j
spec:
  selector:
    app.kubernetes.io/name: graphrag-neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: graphrag-neo4j
  labels:
    app.kubernetes.io/name: graphrag-neo4j
    app.kubernetes.io/component: neo4j
spec:
  serviceName: graphrag-neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphrag-neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphrag-neo4j
        app.kubernetes.io/component: neo4j
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neo4j
          image: neo4j:2026.09.0-community
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: graphrag-secrets
                  key: NEO4J_AUTH
            - name: NEO4J_server_memory_heap_initial__size
              value: 512m
            - name: NEO4J_server_memory_heap_max__size
              value: 768m
            - name: NEO4J_server_memory_pagecache_size
              value: 256m
            - name: NEO4J_server_jvm_additional
              value: -XX:+ExitOnOutOfMemoryError
            - name: NEO4J_dbms_usage__report_enabled
              value: "false"
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 1792Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
