# Production overlay tracked by Argo CD. CI rewrites the image tags below on
# every release (immutable sha-* tags) and commits — that commit *is* the deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/lovichidorian/graphrag-api
    newTag: sha-2da8b5a
  - name: ghcr.io/lovichidorian/graphrag-web
    newTag: sha-2da8b5a
