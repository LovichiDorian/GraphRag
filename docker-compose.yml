# Local stack: Neo4j + API + one-shot ingestion + Next.js.
#   GEMINI_API_KEY=... docker compose up --build   →  http://localhost:3000
name: graphrag

x-api-env: &api-env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localdevpassword}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  ENVIRONMENT: development
  LOG_JSON: "false"
  CORS_ORIGINS: http://localhost:3000
  PUBLIC_URL: http://localhost:3000

services:
  neo4j:
    image: neo4j:2026.09.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-localdevpassword}
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: "false"
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: careergraph-api:dev
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      neo4j: { condition: service_healthy }

  ingest:
    image: careergraph-api:dev
    command: ["careergraph-ingest"]
    environment:
      <<: *api-env
      CACHE_DIR: /cache
    volumes: [ingest-cache:/cache]
    depends_on:
      neo4j: { condition: service_healthy }
      api: { condition: service_started }
    restart: "no"

  web:
    build:
      context: apps/web
      args: { API_INTERNAL_URL: "http://api:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  neo4j-data: {}
  ingest-cache: {}
