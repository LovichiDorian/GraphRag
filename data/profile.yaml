# GitHub ingestion. Public repositories of `user` are fetched at ingestion time
# (README, docs, dependency manifests, languages, topics). Private repositories
# are only ingested when GITHUB_INCLUDE_PRIVATE=true and a token is provided —
# their content becomes public through the chatbot, so opt in deliberately.
github:
  user: LovichiDorian
  exclude: [secret]
  overrides:
    GraphRag: { project: agentic-graphrag }
    EverGoTrips: { project: evergotrips }
