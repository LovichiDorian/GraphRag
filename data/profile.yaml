projects:
  - id: agentic-graphrag
    name: Agentic GraphRAG — Career Knowledge Graph
    featured: true
    url: https://graphrag.dorianlovichi.com
    repo: GraphRag
    period: 2026
    skills:
      [Python, FastAPI, GraphRAG, Knowledge graphs, Neo4j, Vector search, Embeddings, Gemini, AI agents,
       Multi-agent orchestration, Model Context Protocol (MCP), Next.js, React, TypeScript, Three.js,
       Kubernetes, k3s, Argo CD, GitOps, Docker, GitHub Actions, Traefik, cert-manager]
    summary: >-
      This very site. An agentic GraphRAG system that turns a CV and GitHub repositories into a
      Neo4j knowledge graph and lets recruiters query it in natural language, with streamed,
      cited answers and a live 3D view of the evidence subgraph.
    highlights:
      - >-
        Ingestion pipeline: schema-guided LLM extraction (Gemini structured output), entity
        resolution against a canonical technology ontology, dependency-manifest analysis of each
        repository, Louvain community detection with LLM-written community reports, and
        768-dimension Gemini embeddings stored in Neo4j vector indexes.
      - >-
        Retrieval: hybrid vector + full-text search fused with Reciprocal Rank Fusion, then
        HippoRAG-style Personalized PageRank over the knowledge graph to pull in multi-hop
        evidence; a planner agent can also generate guarded read-only Cypher.
      - >-
        Multi-agent orchestration (planner → retriever → synthesizer) with model fallback and
        circuit breakers, streamed to the browser over the Vercel AI SDK UI message protocol;
        job-description fit analyzer with evidence-backed scoring; MCP server so any AI
        assistant can query the graph.
      - >-
        Deployed on a k3s cluster with Argo CD GitOps: multi-arch images (amd64/arm64) built by
        GitHub Actions on native runners, signed with cosign, SBOM + provenance attestations,
        Traefik ingress with rate limiting, cert-manager TLS, NetworkPolicies and a nightly
        re-ingestion CronJob.

